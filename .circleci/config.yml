version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run pytest
          command: pytest tests/ -v --cov=app
      - run:
          name: Coverage report
          command: pytest tests/ --cov=app --cov-report=term-missing

  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: docker build -t quiz-gen .
      - run:
          name: Push to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
            docker tag quiz-gen $DOCKER_USERNAME/quiz-gen:latest
            docker push $DOCKER_USERNAME/quiz-gen:latest