version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project/backend
    environment:
      TESTING: "true"
      FLASK_ENV: "testing"
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run pytest
          command: pytest tests/ -v --cov=app
      - run:
          name: Coverage report
          command: pytest tests/ --cov=app --cov-report=term-missing

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Deploy to Railway
          command: |
            curl -fsSL https://railway.app/install.sh | sh
            railway up --service $RAILWAY_SERVICE_ID

workflows:
  main:
    jobs:
      - test
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main