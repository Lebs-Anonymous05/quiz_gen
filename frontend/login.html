<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuizGen — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center px-4">

  <!-- Logo -->
  <a href="index.html" class="text-2xl font-bold text-indigo-400 mb-8">QuizGen</a>

  <!-- Card -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md">

    <!-- Tabs -->
    <div class="flex mb-8 bg-gray-800 rounded-lg p-1">
      <button id="loginTab"
        onclick="showTab('login')"
        class="flex-1 py-2 rounded-md text-sm font-semibold transition bg-indigo-600 text-white">
        Login
      </button>
      <button id="registerTab"
        onclick="showTab('register')"
        class="flex-1 py-2 rounded-md text-sm font-semibold transition text-gray-400 hover:text-white">
        Register
      </button>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="hidden bg-red-900 border border-red-700 text-red-300 text-sm px-4 py-3 rounded-lg mb-4"></div>

    <!-- Success Message -->
    <div id="successMsg" class="hidden bg-green-900 border border-green-700 text-green-300 text-sm px-4 py-3 rounded-lg mb-4"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input type="email" id="loginEmail" required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
          placeholder="you@example.com"/>
      </div>
      <div class="mb-6">
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input type="password" id="loginPassword" required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
          placeholder="••••••••"/>
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-lg font-semibold transition">
        Login
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">Full Name</label>
        <input type="text" id="regName" required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
          placeholder="Hopkins Bah"/>
      </div>
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input type="email" id="regEmail" required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
          placeholder="you@example.com"/>
      </div>
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input type="password" id="regPassword" required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
          placeholder="••••••••"/>
      </div>
      <div class="mb-6">
        <label class="block text-sm text-gray-400 mb-1">Role</label>
        <select id="regRole"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
          <option value="student">Student</option>
          <option value="lecturer">Lecturer</option>
        </select>
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-lg font-semibold transition">
        Create Account
      </button>
    </form>

  </div>

  <script>
    const API = "https://quizgen.up.railway.app/api";

    // Check if URL has #register
    if (window.location.hash === "#register") showTab("register");

    function showTab(tab) {
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");
      clearMessages();

      if (tab === "login") {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
        loginTab.classList.add("bg-indigo-600", "text-white");
        loginTab.classList.remove("text-gray-400");
        registerTab.classList.remove("bg-indigo-600", "text-white");
        registerTab.classList.add("text-gray-400");
      } else {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        registerTab.classList.add("bg-indigo-600", "text-white");
        registerTab.classList.remove("text-gray-400");
        loginTab.classList.remove("bg-indigo-600", "text-white");
        loginTab.classList.add("text-gray-400");
      }
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function showSuccess(msg) {
      const el = document.getElementById("successMsg");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function clearMessages() {
      document.getElementById("errorMsg").classList.add("hidden");
      document.getElementById("successMsg").classList.add("hidden");
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error || "Login failed");

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "dashboard.html";
      } catch {
        showError("Could not connect to server. Is the backend running?");
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearMessages();
      const full_name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      const role = document.getElementById("regRole").value;

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name, email, password, role })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error || "Registration failed");

        showSuccess("Account created! You can now login.");
        setTimeout(() => showTab("login"), 1500);
      } catch {
        showError("Could not connect to server. Is the backend running?");
      }
    }
  </script>

</body>
</html>
