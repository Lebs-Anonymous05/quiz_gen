<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuizGen — Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-8 py-5 border-b border-gray-800">
    <h1 class="text-2xl font-bold text-indigo-400">QuizGen <span class="text-xs bg-red-600 px-2 py-1 rounded-full ml-2">ADMIN</span></h1>
    <div class="flex items-center gap-6">
      <span id="welcomeMsg" class="text-gray-400 text-sm"></span>
      <a href="dashboard.html" class="text-gray-400 hover:text-white text-sm transition">User Dashboard</a>
      <button onclick="logout()" class="text-gray-400 hover:text-white text-sm transition">Logout</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 px-8 py-10 max-w-6xl mx-auto w-full">

    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <p class="text-gray-400 text-sm mb-1">Total Users</p>
        <p id="totalUsers" class="text-4xl font-bold text-indigo-400">—</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <p class="text-gray-400 text-sm mb-1">Total Quizzes</p>
        <p id="totalQuizzes" class="text-4xl font-bold text-indigo-400">—</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <p class="text-gray-400 text-sm mb-1">Total Attempts</p>
        <p id="totalAttempts" class="text-4xl font-bold text-indigo-400">—</p>
      </div>
    </div>

    <!-- Users Table -->
    <div class="mb-10">
      <h2 class="text-xl font-bold mb-6">All Users</h2>
      <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden overflow-x-auto">
        <table class="w-full text-sm min-w-[700px]">
           <thead class="bg-gray-800 text-gray-400 uppercase tracking-wider text-xs">
            <tr>
              <th class="px-6 py-4 text-left">Name</th>
              <th class="px-6 py-4 text-left">Email</th>
              <th class="px-6 py-4 text-left">Role</th>
              <th class="px-6 py-4 text-left">Quizzes</th>
              <th class="px-6 py-4 text-left">Joined</th>
              <th class="px-6 py-4 text-left">Actions</th>
            </tr>
          </thead>
          <tbody id="usersTable" class="divide-y divide-gray-800">
            <!-- Populated by JS -->
          </tbody>
        </table>
        <div id="noUsers" class="hidden text-center py-10 text-gray-600">No users found.</div>
      </div>
    </div>

    <!-- Quizzes Table -->
    <div>
      <h2 class="text-xl font-bold mb-6">All Quizzes</h2>
      <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden overflow-x-auto">
        <table class="w-full text-sm min-w-[500px]">
          <thead class="bg-gray-800 text-gray-400 uppercase">
            <tr>
              <th class="px-6 py-4 text-left">Title</th>
              <th class="px-6 py-4 text-left">Creator</th>
              <th class="px-6 py-4 text-left">Questions</th>
              <th class="px-6 py-4 text-left">Created</th>
            </tr>
          </thead>
          <tbody id="quizzesTable" class="divide-y divide-gray-800">
            <!-- Populated by JS -->
          </tbody>
        </table>
        <div id="noQuizzes" class="hidden text-center py-10 text-gray-600">No quizzes found.</div>
      </div>
    </div>

  </main>

  <script>
    const API = "http://127.0.0.1:5000/api";
    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("user") || "{}");

    if (!token) window.location.href = "login.html";
    if (user.role !== "admin") window.location.href = "dashboard.html";

    document.getElementById("welcomeMsg").textContent = `Hi, ${user.full_name || "Admin"}`;

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      };
    }

    const roleColors = {
      admin: "bg-red-900 text-red-300",
      lecturer: "bg-indigo-900 text-indigo-300",
      student: "bg-gray-800 text-gray-300"
    };

    async function loadStats() {
      try {
        const res = await fetch(`${API}/admin/stats`, { headers: authHeaders() });
        const data = await res.json();
        document.getElementById("totalUsers").textContent = data.total_users;
        document.getElementById("totalQuizzes").textContent = data.total_quizzes;
        document.getElementById("totalAttempts").textContent = data.total_attempts;
      } catch {
        console.error("Failed to load stats");
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${API}/admin/users`, { headers: authHeaders() });
        const data = await res.json();
        const users = data.users || [];

        const tbody = document.getElementById("usersTable");

        if (users.length === 0) {
          document.getElementById("noUsers").classList.remove("hidden");
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr class="hover:bg-gray-800 transition">
            <td class="px-6 py-4 font-semibold">${u.full_name}</td>
            <td class="px-6 py-4 text-gray-400">${u.email}</td>
            <td class="px-6 py-4">
              <span class="px-2 py-1 rounded-full text-xs font-semibold ${roleColors[u.role] || roleColors.student}">
                ${u.role}
              </span>
            </td>
            <td class="px-6 py-4 text-gray-400">${u.quiz_count}</td>
            <td class="px-6 py-4 text-gray-400">${new Date(u.created_at).toLocaleDateString()}</td>
            <td class="px-6 py-4">
              <div class="flex gap-2">
                <select onchange="updateRole(${u.id}, this.value)"
                  class="bg-gray-800 border border-gray-700 text-white text-xs rounded px-2 py-1 focus:outline-none">
                  <option value="student" ${u.role === 'student' ? 'selected' : ''}>Student</option>
                  <option value="lecturer" ${u.role === 'lecturer' ? 'selected' : ''}>Lecturer</option>
                  <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                </select>
                <button onclick="deleteUser(${u.id})"
                  class="text-red-400 hover:text-red-300 text-xs border border-red-800 hover:border-red-600 px-2 py-1 rounded transition">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        `).join("");
      } catch {
        console.error("Failed to load users");
      }
    }

    async function loadQuizzes() {
      try {
        const res = await fetch(`${API}/admin/quizzes`, { headers: authHeaders() });
        const data = await res.json();
        const quizzes = data.quizzes || [];

        const tbody = document.getElementById("quizzesTable");

        if (quizzes.length === 0) {
          document.getElementById("noQuizzes").classList.remove("hidden");
          return;
        }

        tbody.innerHTML = quizzes.map(q => `
          <tr class="hover:bg-gray-800 transition">
            <td class="px-6 py-4 font-semibold">${q.title}</td>
            <td class="px-6 py-4 text-gray-400">${q.creator}</td>
            <td class="px-6 py-4 text-gray-400">${q.question_count}</td>
            <td class="px-6 py-4 text-gray-400">${new Date(q.created_at).toLocaleDateString()}</td>
          </tr>
        `).join("");
      } catch {
        console.error("Failed to load quizzes");
      }
    }

    async function updateRole(userId, newRole) {
      try {
        const res = await fetch(`${API}/admin/users/${userId}/role`, {
          method: "PATCH",
          headers: authHeaders(),
          body: JSON.stringify({ role: newRole })
        });
        if (res.ok) {
          loadUsers();
          loadStats();
        } else {
          alert("Failed to update role.");
        }
      } catch {
        alert("Could not connect to server.");
      }
    }

    async function deleteUser(userId) {
      if (!confirm("Are you sure you want to delete this user? This cannot be undone.")) return;
      try {
        const res = await fetch(`${API}/admin/users/${userId}`, {
          method: "DELETE",
          headers: authHeaders()
        });
        if (res.ok) {
          loadUsers();
          loadStats();
        } else {
          alert("Failed to delete user.");
        }
      } catch {
        alert("Could not connect to server.");
      }
    }

    loadStats();
    loadUsers();
    loadQuizzes();
  </script>

</body>
</html>
